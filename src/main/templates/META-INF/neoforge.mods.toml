modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
authors="Indoorhades"
description='''Prepaid electricity economy for Create: Power Grid with Create: Numismatics payments.'''

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="powergrid"
type="required"
versionRange="[0.6.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="numismatics"
type="required"
versionRange="[1.1.0,)"
ordering="AFTER"
side="BOTH"
