modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

authors="Luis Javier Barona Plazas"
description='''
Power Grid Economy: electrical service plans, energy consumption and Numismatics payments.
'''

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Create is the core library/mod used by Power Grid and Numismatics.
[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,6.1.0)"
    ordering="AFTER"
    side="BOTH"

# Architectury is required by Create: Power Grid 0.6.1.
[[dependencies.${mod_id}]]
    modId="architectury"
    type="required"
    versionRange="[13.0.8,)"
    ordering="AFTER"
    side="BOTH"

# Create: Power Grid 0.6.1 for Minecraft 1.21.1 NeoForge.
[[dependencies.${mod_id}]]
    modId="powergrid"
    type="required"
    versionRange="[0.6.1,)"
    ordering="AFTER"
    side="BOTH"

# Create: Numismatics 1.1.0 for Minecraft 1.21.1 NeoForge.
[[dependencies.${mod_id}]]
    modId="numismatics"
    type="required"
    versionRange="[1.1.0,)"
    ordering="AFTER"
    side="BOTH"
